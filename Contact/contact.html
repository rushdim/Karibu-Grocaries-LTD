
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="/Contact/contac.css">
</head>
<body>


<section class="contact-section">
    <div class="contact-container">
        <h2>Get in Touch with Karibu Groceries</h2>
        <p>Created by Rushdi Mustafa Yousif Adam</p>

        <div class="contact-grid">
            <!-- Contact Card -->
            <div class="contact-info">
                <div class="info-item">
                    <i class="fas fa-phone"></i>
                    <p><strong>Call / WhatsApp:</strong> <br> 0789817673</p>
                </div>
                <div class="info-item">
                    <i class="fas fa-envelope"></i>
                    <p><strong>Email:</strong> <br> karibugroceries@gmail.com</p>
                </div>
                <div class="social-links">
                    <a href="#" title="Facebook"><i class="fab fa-facebook"></i> Facebook</a>
                    <a href="#" title="LinkedIn"><i class="fab fa-linkedin"></i> LinkedIn</a>
                </div>
            </div>

            <!-- Simple Contact Form -->
            <form class="contact-form">
                <input type="text" placeholder="Your Name" required>
                <input type="email" placeholder="Your Email" required>
                <textarea placeholder="How can we help you today?" rows="4"></textarea>
                <button type="submit">Send Message</button>
            </form>
        </div>
    </div>
</section>

</body>

</html>
