
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="/Contact/contac.css">
</head>
<body>
<section style="padding: 60px 40px; max-width: 600px; margin: auto;">
    <h2 style="color: #1a6b3c; text-align: center;">Contact Us</h2>
    <div style="background: white; padding: 40px; border-radius: 15px;
       box-shadow: 0 4px 20px rgba(0,0,0,0.1);">
        <p>📍 Kampala, Uganda</p>
        <p>📞 +256 789 817 673</p>
        <p>📧 karibu@groceries.ug</p>
        <p>⏰ Mon-Sat: 8am - 8pm</p>
        <hr style="margin: 20px 0;">
        <input placeholder="Your Name" style="width: 100%; padding: 10px; 
       margin-bottom: 10px; border: 1px solid #ddd; border-radius: 8px;">
        <input placeholder="Your Email" style="width: 100%; padding: 10px;
       margin-bottom: 10px; border: 1px solid #ddd; border-radius: 8px;">
        <textarea placeholder="Your Message" rows="4" style="width: 100%; 
       padding: 10px; border: 1px solid #ddd; border-radius: 8px;"></textarea>
        <button style="width: 100%; background: #1a6b3c; color: white;
       padding: 12px; border: none; border-radius: 8px; 
       font-size: 16px; cursor: pointer; margin-top: 10px;">
            Send Message
        </button>
    </div>
</section>

<section class="contact-section">
    <div class="contact-container">
        <h2>Get in Touch with Karibu Groceries</h2>
        <p>Created by Rushdi Mustafa Yousif Adam</p>

        <div class="contact-grid">
            <!-- Contact Card -->
            <div class="contact-info">
                <div class="info-item">
                    <i class="fas fa-phone"></i>
                    <p><strong>Call / WhatsApp:</strong> <br> 0789817673</p>
                </div>
                <div class="info-item">
                    <i class="fas fa-envelope"></i>
                    <p><strong>Email:</strong> <br> karibugroceries@gmail.com</p>
                </div>
                <div class="social-links">
                    <a href="#" title="Facebook"><i class="fab fa-facebook"></i> Facebook</a>
                    <a href="#" title="LinkedIn"><i class="fab fa-linkedin"></i> LinkedIn</a>
                </div>
            </div>

            <!-- Simple Contact Form -->
            <form class="contact-form">
                <input type="text" placeholder="Your Name" required>
                <input type="email" placeholder="Your Email" required>
                <textarea placeholder="How can we help you today?" rows="4"></textarea>
                <button type="submit">Send Message</button>
            </form>
        </div>
    </div>
</section>

</body>

</html>
