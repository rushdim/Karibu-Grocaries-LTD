<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Karibu Groceries - Join Us</title>
    <link rel="stylesheet" href="/creataccount/signin.css">
</head>

<body>
    <div class="container">
        <!-- Register Section -->
        <div id="register-form" class="form-box">
            <h2>Karibu Groceries</h2>
            <p>Freshness at your doorstep.</p>
        
            <!-- Wrapped in a form to stop browser warnings -->
            <form onsubmit="event.preventDefault(); sendVerification();">
                <div class="input-group">
                    <input type="text" id="reg-name" placeholder="Full Name" required>
                </div>
        
                <div class="input-group">
                    <input type="email" id="reg-email" placeholder="Email Address" required>
                </div>
        
                <div class="input-group">
                    <div style="position: relative;">
                        <input type="password" id="reg-password" placeholder="Password (8+ chars)" oninput="checkStrength()"
                            required>
                        <span onclick="togglePassword('reg-password')" class="eye-icon">👁️</span>
                    </div>
                    <div id="strength-meter-container"
                        style="height: 5px; width: 100%; background: #eee; margin-top: 5px; border-radius: 10px; overflow: hidden;">
                        <div id="strength-bar" style="height: 100%; width: 0%; transition: 0.3s ease;"></div>
                    </div>
                    <small id="strength-text" style="font-size: 12px;"></small>
                </div>
        
                <div class="input-group">
                    <div style="position: relative;">
                        <input type="password" id="confirm-password" placeholder="Confirm Password" required>
                        <span onclick="togglePassword('confirm-password')" class="eye-icon">👁️</span>
                    </div>
                </div>
        
                <!-- Changed to type="submit" so the form submits correctly -->
                <button type="submit">Create Account</button>
            </form>
            <p class="toggle">Already have an account? <a href="/login.html"><span>login</span></a></p>
        </div>
    </div>
    <script src="/creataccount/signin.js"></script>
</body>
<!-- WHATSAPP BUTTON -->
<a id="whatsappBtn"
    href="https://wa.me/256789817673?text=Hello%20Karibu%20Groceries!%20I%20would%20like%20to%20place%20an%20order."
    target="_blank" style="position: fixed; bottom: 90px; right: 30px; background: #25D366;
  color: white; width: 55px; height: 55px; border-radius: 50%;
  display: flex; justify-content: center; align-items: center;
  font-size: 28px; box-shadow: 0 4px 15px rgba(0,0,0,0.3);
  text-decoration: none; z-index: 999; transition: transform 0.3s;">
    <i class="fab fa-whatsapp"></i>
</a>

<script>
    // WhatsApp button with basket items
    document.addEventListener('DOMContentLoaded', function () {
        const btn = document.getElementById('whatsappBtn');
        if (!btn) return;

        const basket = JSON.parse(localStorage.getItem('karibu_basket')) || [];

        if (basket.length > 0) {
            const items = basket.map(item =>
                `• ${item.name} x${item.qty} = ${(item.price * item.qty).toLocaleString()} UGX`
            ).join('%0A');
            const total = basket.reduce((sum, item) => sum + item.price * item.qty, 0);
            const msg = `Hello Karibu Groceries!%0AI would like to order:%0A${items}%0A%0ATotal: ${total.toLocaleString()} UGX%0APlease confirm my order.`;
            btn.href = `https://wa.me/256789817673?text=${msg}`;
        }

        btn.addEventListener('mouseover', () => btn.style.transform = 'scale(1.1)');
        btn.addEventListener('mouseout', () => btn.style.transform = 'scale(1)');
    });
</script>

</html>
