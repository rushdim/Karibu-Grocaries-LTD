<!-- Main Dashboard Container -->
<main class="col main-content">
    <header class="d-flex justify-content-between align-items-center mb-4">
        <h2>Director Overview:</h2>
        <!-- Login/Profile Icon -->
        <div class="d-flex align-items-center">
            <i class="fa-solid fa-gear me-3 settings-icon" onclick="showPage('settings-page')"></i>
            <img width="60" src="/img/2.png" class="rounded-circle" alt="Admin Profile">
        </div>
    </header>

    <!-- Stats Grid -->
    <div class="row g-4 mb-5">
        <div class="col-md-4">
            <div class="card stat-card bg-primary text-white p-3 shadow-sm">
                <h5>Total Revenue</h5>
                <h3>UgX 45,000,000</h3>
                <i class="fas fa-money-bill-wave fa-2x opacity-50"></i>
            </div>
        </div>
    </div>

    <!-- Product Photos Section -->
    <h4 class="mb-3">Inventory Status</h4>
    <div class="row g-3">
        <div class="col-md-3">
            <div class="card h-100 p-2 text-center">
                <img src="/img/Beans.jpg" class="produce-img mb-2" alt="Beans">
                <h6>Beans</h6>
                <small class="text-muted">Stock: 4,000kg</small>
            </div>
        </div>
        <!-- Additional product cards for Maize, G-nuts, etc. -->
    </div>
</main>
