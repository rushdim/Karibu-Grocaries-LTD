<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Wishlist — Karibu Groceries</title>
    <link rel="icon" type="image/png" href="/img/2.png">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', sans-serif;
        }

        body {
            background: #f5f7fa;
        }

        .wish-card {
            background: white;
            border-radius: 15px;
            overflow: hidden;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
            transition: transform 0.3s;
        }

        .wish-card:hover {
            transform: translateY(-5px);
        } 
        /* Nav Bar  */

      .navbar{
    background:linear-gradient(135deg,#1a6b3c,#2d9e5f);
    padding:12px 20px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    position:sticky;
    top:0;
    z-index:1000;
}

.logo{
    display:flex;
    align-items:center;
    gap:8px;
}

.logo img{
    height:40px;
}

.logo h2{
    color:white;
    font-size:20px;
    margin:0;
}

.menu-toggle{
    display:none;
    background:none;
    border:none;
    color:white;
    font-size:30px;
    cursor:pointer;
}

.nav-links{
    display:flex;
    gap:15px;
    align-items:center;
}

.nav-links a{
    color:white;
    text-decoration:none;
}

.signin-btn{
    background:white;
    color:#1a6b3c !important;
    padding:8px 15px;
    border-radius:20px;
}

@media(max-width:768px){

    .logo img{
        height:32px;
    }

    .logo h2{
        font-size:14px;
    }

    .menu-toggle{
        display:block;
    }

    .nav-links{
        display:none;
        position:absolute;
        top:65px;
        left:0;
        width:100%;
        background:#1a6b3c;
        flex-direction:column;
        padding:15px;
    }

    .nav-links.active{
        display:flex;
    }
}

    </style>
</head>

<body>
<nav class="navbar">



    <div class="logo">
        <img src="/img/2.png" alt="logo">
        <h2>Karibu Groceries</h2>
    </div>
    <select id="languageSwitcher">
        <option value="en">English</option>
        <option value="ar">العربية</option>
    </select>

    <button class="menu-toggle" id="menuToggle">☰</button>
    <div class="nav-links" id="navLinks">
        <a href="/index.html" data-lang="home">Home</a>

        <a href="/about/about.html" data-lang="about">
            About Us
        </a>

        <a href="/all Products/product.html" data-lang="products">
            Products
        </a>

        <a href="/Basket/basket.html" data-lang="basket">
            🛒 Basket
        </a>

        <a href="/Contact/contact.html" data-lang="contact">
            Contact
        </a>

        <a href="/wishlist/wishlist.html" data-lang="wishlist">
            ❤️ Wishlist
        </a>

        <a href="/login.html" class="signin-btn" data-lang="signin">
            Sign In
        </a>
    </div>
</nav>


    <section style="background: linear-gradient(135deg, #1a6b3c, #2d9e5f);
    color: white; padding: 40px; text-align: center;">
        <h1>❤️ My Wishlist</h1>
        <p style="opacity: 0.9;">Your saved favourite products</p>
    </section>

    <div class="container" style="padding: 40px 20px;">
        <div id="wishlistGrid" class="row g-4"></div>
        <div id="emptyWishlist" style="display: none; text-align: center; padding: 80px 20px;">
            <div style="font-size: 80px;">🤍</div>
            <h3 style="color: #999; margin-top: 20px;">Your wishlist is empty</h3>
            <p style="color: #bbb; margin-bottom: 20px;">Save products you love!</p>
            <a href="/all Products/product.html">
                <button style="background: #1a6b3c; color: white; border: none;
          padding: 12px 30px; border-radius: 20px; font-size: 16px; cursor: pointer;">
                    Browse Products →
                </button>
            </a>
        </div>
    </div>

    <footer style="background: #1a6b3c; color: white; text-align: center; padding: 30px; margin-top: 40px;">
        <p>© 2026 Karibu Groceries LTD — Built by Rushdi Mustafa Yousif Adam</p>
    </footer>

    <script>
        function addToBasket(name, price, img) {
            let basket = JSON.parse(localStorage.getItem('karibu_basket')) || [];
            const existing = basket.find(item => item.name === name);
            if (existing) { existing.qty += 1; }
            else { basket.push({ name, price, img, qty: 1 }); }
            localStorage.setItem('karibu_basket', JSON.stringify(basket));
            alert('✅ ' + name + ' added to basket!');
        }

        function removeFromWishlist(name) {
            let wishlist = JSON.parse(localStorage.getItem('karibu_wishlist')) || [];
            wishlist = wishlist.filter(item => item.name !== name);
            localStorage.setItem('karibu_wishlist', JSON.stringify(wishlist));
            renderWishlist();
        }

        function renderWishlist() {
            const wishlist = JSON.parse(localStorage.getItem('karibu_wishlist')) || [];
            const grid = document.getElementById('wishlistGrid');
            const empty = document.getElementById('emptyWishlist');

            if (wishlist.length === 0) {
                grid.innerHTML = '';
                empty.style.display = 'block';
                return;
            }

            empty.style.display = 'none';
            grid.innerHTML = wishlist.map(item => `
        <div class="col-6 col-md-4 col-lg-3">
          <div class="wish-card">
            <img src="${item.img}" alt="${item.name}"
              style="width: 100%; height: 150px; object-fit: cover;"
              onerror="this.src='/img/2.png'">
            <div style="padding: 15px;">
              <h6 style="color: #1a6b3c;">${item.name}</h6>
              <p style="color: #666; font-weight: bold;">${item.price.toLocaleString()} UGX</p>
              <button onclick="addToBasket('${item.name}', ${item.price}, '${item.img}')"
                style="width: 100%; background: #1a6b3c; color: white; border: none;
                padding: 8px; border-radius: 8px; cursor: pointer; margin-bottom: 8px;">
                🛒 Add to Basket
              </button>
              <button onclick="removeFromWishlist('${item.name}')"
                style="width: 100%; background: #ff4d4d; color: white; border: none;
                padding: 8px; border-radius: 8px; cursor: pointer;">
                ✕ Remove
              </button>
            </div>
          </div>
        </div>
      `).join('');
        }

        renderWishlist();
    </script>
    <script>
        const menuToggle = document.getElementById('menuToggle');
        const navLinks = document.getElementById('navLinks');

        menuToggle.addEventListener('click', () => {
            navLinks.classList.toggle('active');
        });
    </script>
    <script src="/js/translations.js"></script>

</body>

</html>
