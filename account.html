<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Account - Karibu Groceries</title>

    <style>

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f7f6;
        }

        .container {
    max-width: 1100px;
    margin: 30px auto;
    padding: 20px;
}

.grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
    gap: 20px;
}

.card {
    background: white;
    padding: 20px;
    border-radius: 14px;
    box-shadow: 0 5px 20px rgba(0,0,0,0.08);
    transition: 0.3s;
}

.card:hover {
    transform: translateY(-3px);
}

h2 {
    color: #2d6a4f;
    margin-bottom: 15px;
}

input {
    width: 100%;
    padding: 10px;
    margin: 6px 0;
    border: 1px solid #ddd;
    border-radius: 8px;
}

button {
    width: 100%;
    margin-top: 10px;
    padding: 10px;
    border: none;
    border-radius: 8px;
    background: #2d6a4f;
    color: white;
    cursor: pointer;
}

button:hover {
    background: #1f4d38;
}

.logout {
    background: #e74c3c;
}

.logout:hover {
    background: #c0392b;
}

.item {
    display: flex;
    justify-content: space-between;
    padding: 6px 0;
    border-bottom: 1px solid #eee;
}

          /* Nav Bar  */

      .navbar{
    background:linear-gradient(135deg,#1a6b3c,#2d9e5f);
    padding:12px 20px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    position:sticky;
    top:0;
    z-index:1000;
}

.logo{
    display:flex;
    align-items:center;
    gap:8px;
}

.logo img{
    height:40px;
}

.logo h2{
    color:white;
    font-size:20px;
    margin:0;
}

.menu-toggle{
    display:none;
    background:none;
    border:none;
    color:white;
    font-size:30px;
    cursor:pointer;
}

.nav-links{
    display:flex;
    gap:15px;
    align-items:center;
}

.nav-links a{
    color:white;
    text-decoration:none;
}

.signin-btn{
    background:white;
    color:#1a6b3c !important;
    padding:8px 15px;
    border-radius:20px;
}

@media(max-width:768px){

    .logo img{
        height:32px;
    }

    .logo h2{
        font-size:14px;
    }

    .menu-toggle{
        display:block;
    }

    .nav-links{
        display:none;
        position:absolute;
        top:65px;
        left:0;
        width:100%;
        background:#1a6b3c;
        flex-direction:column;
        padding:15px;
    }

    .nav-links.active{
        display:flex;
    }
}

        .logout {
            background: #e74c3c;
        }

        .logout:hover {
            background: #c0392b;
        }

        ul {
            padding-left: 20px;
        }

        .item {
            display: flex;
            justify-content: space-between;
            padding: 5px 0;
        }
    </style>
</head>

<body>


    <!-- NAVBAR -->
    <nav class="navbar">
    
    
    
        <div class="logo">
            <img src="/img/2.png" alt="logo">
            <h2>Karibu Groceries</h2>
        </div>
        <select id="languageSwitcher">
            <option value="en">English</option>
            <option value="ar">العربية</option>
        </select>
    
        <button class="menu-toggle" id="menuToggle">☰</button>
        <div class="nav-links" id="navLinks">
            <a href="/index.html" data-lang="home">Home</a>
    
            <a href="/about/about.html" data-lang="about">
                About Us
            </a>
    
            <a href="/all Products/product.html" data-lang="products">
                Products
            </a>
    
            <a href="/Basket/basket.html" data-lang="basket">
                🛒 Basket
            </a>
    
            <a href="/Contact/contact.html" data-lang="contact">
                Contact
            </a>
    
            <a href="/wishlist/wishlist.html" data-lang="wishlist">
                ❤️ Wishlist
            </a>
    
            <a href="/login.html" class="signin-btn" data-lang="signin">
                Sign In
            </a>
        </div>
    </nav>

<div class="container">

    <!-- TOP GRID -->
    <div class="grid">

        <!-- USER CARD -->
        <div class="card">
            <h2>👤 My Account</h2>
            <div id="userInfo"></div>
            <button class="logout" onclick="logout()">Logout</button>
        </div>

        <!-- EDIT PROFILE -->
        <div class="card">
            <h2>✏️ Edit Profile</h2>

            <input type="text" id="name" placeholder="Name">
            <input type="text" id="phone" placeholder="Phone">
            <input type="text" id="address" placeholder="Address">

            <button onclick="saveProfile()">Save Changes</button>
        </div>

    </div>

    <!-- SECOND GRID -->
    <div class="grid">

        <!-- BASKET -->
        <div class="card">
            <h2>🛒 My Basket</h2>
            <div id="basketContainer"></div>
            <h3 id="totalPrice"></h3>
        </div>

        <!-- ORDERS -->
        <div class="card">
            <h2>📦 My Orders</h2>
            <div id="ordersContainer"></div>
        </div>

    </div>

</div>

    <script>



   

    async function loadOrders() {

        try {

            const response = await fetch(
                `https://karibu-grocaries-ltd.vercel.app/api/orders/user/${user.email}`
            );

            const orders = await response.json();

            const container =
                document.getElementById("ordersContainer");

            if (!orders.length) {

                container.innerHTML =
                    "<p>No orders found.</p>";

                return;
            }

            container.innerHTML = "";

            orders.forEach(order => {

                container.innerHTML += `
                <div style="
                    border:1px solid #ddd;
                    padding:15px;
                    margin-bottom:10px;
                    border-radius:8px;
                ">
                    <p><strong>Order ID:</strong> ${order.id}</p>

                    <p><strong>Total:</strong>
                    ${order.total.toLocaleString()} UGX</p>

                    <p><strong>Status:</strong>
                    ${order.status}</p>

                    <p><strong>Date:</strong>
                    ${new Date(order.date).toLocaleDateString()}</p>
                </div>
            `;

            });

        } catch (err) {

            console.error(err);

        }

    }
        /* =========================
           LOAD USER SESSION
        ========================= */
        const user = JSON.parse(localStorage.getItem("userSession"));

        if (!user) {
            window.location.href = "/login.html";
        }

        loadAccount();
             loadOrders();


            async function loadAccount() {

                try {

                    const response = await fetch(
                        `https://karibu-grocaries-ltd.vercel.app/api/account/${user.email}`
                    );

                    const account = await response.json();

                    document.getElementById("userInfo").innerHTML = `
            <p><strong>Name:</strong> ${account.name}</p>
            <p><strong>Email:</strong> ${account.email}</p>
            <p><strong>Phone:</strong> ${account.phone || "Not set"}</p>
            <p><strong>Address:</strong> ${account.address || "Not set"}</p>
            <p><strong>Role:</strong> ${account.role}</p>
            <p><strong>Joined:</strong> ${new Date(account.createdAt).toLocaleDateString()}</p>
        `;

                    document.getElementById("name").value =
                        account.name || "";

                    document.getElementById("phone").value =
                        account.phone || "";

                    document.getElementById("address").value =
                        account.address || "";

                } catch (err) {

                    console.error(err);

                }

            }

        /* =========================
           LOAD USER BASKET
        ========================= */
        const basketKey = `basket_${user.email}`;
        const basket = JSON.parse(localStorage.getItem(basketKey)) || [];

        const basketContainer = document.getElementById("basketContainer");
        const totalPriceEl = document.getElementById("totalPrice");

        function renderBasket() {
            if (basket.length === 0) {
                basketContainer.innerHTML = "<p>Your basket is empty 🛒</p>";
                totalPriceEl.innerText = "";
                return;
            }

            let total = 0;

            basketContainer.innerHTML = "<ul>";

            basket.forEach((item, index) => {
                const itemTotal = item.price * item.qty;
                total += itemTotal;

                basketContainer.innerHTML += `
            <li class="item">
                <span>${item.name} (x${item.qty})</span>
                <span>${itemTotal.toLocaleString()} UGX</span>
            </li>
        `;
            });

            basketContainer.innerHTML += "</ul>";
            totalPriceEl.innerText = "Total: " + total.toLocaleString() + " UGX";
        }

        renderBasket();

        /* =========================
           LOGOUT
        ========================= */
        function logout() {
            localStorage.removeItem("userSession");
            window.location.href = "/login.html";
        }

        async function saveProfile() {

                const session = JSON.parse(
                    localStorage.getItem("userSession")
                );

                await fetch(
                    `https://karibu-grocaries-ltd.vercel.app/api/account/${session.email}`,
                    {
                        method: "PUT",
                        headers: {
                            "Content-Type": "application/json"
                        },
                        body: JSON.stringify({
                            name: document.getElementById("name").value,
                            phone: document.getElementById("phone").value,
                            address: document.getElementById("address").value
                        })
                    }
                );

                alert("Profile updated successfully");

            }
    </script>
    <script src="/js/translations.js"></script>

</body>

</html>
