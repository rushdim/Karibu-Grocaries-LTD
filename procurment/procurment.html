<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Procure Produce</title>
    <link rel="stylesheet" href="proucerment.css">
</head>

<body>
     <div class="form-container">
        <h1>Procure Produce (Manager Entry)</h1>
        <form id="procurementForm">
            <div class="form-group">
                <label for="produceName">Produce Name</label>
                <select id="produceName" name="produceName">
                    <option value="Beans">Beans</option>
                    <option value="Maize">Maize</option>
                    <option value="Coffee">G-nuts</option>
                    <option value="Coffee">Tomatow</option>

                </select>
            </div>
            <div class="form-group">
                <label for="tonnage">Tonnage (Min 1000kg)</label>
                <input type="number" id="tonnage" name="tonnage" min="1000" required>
            </div>
            <div class="form-group">
                <label for="cost">Cost (UgX - Min 5 digits)</label>
                <input type="number" id="cost" name="cost" min="10000" required>
            </div>
            <div class="form-group">
                <label for="dealerName">Dealer Name</label>
                <input type="text" id="dealerName" name="dealerName" required>
            </div>
            <button type="submit">Record Procurement</button>
        </form>
    </div>

    <div class="results-container" id="resultsContainer">
        
    </div>

   
<script>
    document.getElementById('procurementForm').addEventListener('submit', function (event) {
            // Prevent the actual form submission
            event.preventDefault();

            // 1. Get input values
            const produce = document.getElementById('produceName').value;
            const tonnage = document.getElementById('tonnage').value;
            const cost = document.getElementById('cost').value;
            const dealer = document.getElementById('dealerName').value.trim();
            const statusDiv = document.getElementById('statusMessage');

            // 2. Setup styles and reset
            statusDiv.style.display = "block";
            statusDiv.style.color = "white";
            statusDiv.style.backgroundColor = "red"; // Default to error color

            // 3. Validation Logic
            if (!produce || !tonnage || !cost || dealer === "") {
                statusDiv.innerText = "Error: All fields are required.";
                return;
            }

            if (parseFloat(tonnage) < 1000) {
                statusDiv.innerText = "Error: Tonnage must be at least 1000kg.";
                return;
            }

            if (cost.length < 5) {
                statusDiv.innerText = "Error: Cost must be at least 5 digits (e.g., 10,000).";
                return;
            }

            // 4. Success Logic
            statusDiv.style.backgroundColor = "green";
            statusDiv.innerText = `Success: Procurement for ${tonnage}kg of ${produce} from ${dealer} recorded!`;

            // Clear form after success
            this.reset();
        });

</script>
</body>

</html>
