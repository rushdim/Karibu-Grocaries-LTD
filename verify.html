<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verify Account - Karibu Groceries</title>
    <link rel="stylesheet" href="style.css"> <!-- Reusing your existing styles -->
    <style>
        .hidden {
            display: none !important;
        }

        .verify-card {
            max-width: 400px;
            margin: 50px auto;
            padding: 30px;
            text-align: center;
        }

        .success-icon {
            font-size: 50px;
            color: #2ecc71;
            margin-bottom: 15px;
        }

        #login-btn-container button {
            background-color: #27ae60;
            margin-top: 20px;
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="form-box verify-card">
            <h2>Verify Your Account</h2>
            <p id="verify-msg">Please enter the 4-digit code sent to your email.</p>

            <div id="verify-section">
                <div class="input-group">
                    <input type="text" id="verify-code" placeholder="Enter Code (e.g. 1234)" maxlength="4"
                        style="text-align: center; font-size: 24px; letter-spacing: 5px;">
                </div>
                <button onclick="verifyAndSave()">Verify Now</button>
            </div>

            <!-- This section stays hidden until success -->
            <div id="success-section" class="hidden">
                <div class="success-icon">Check! ✅</div>
                <h3>Account Verified!</h3>
                <p>Welcome to the family. You can now log in to start shopping.</p>
                <div id="login-btn-container">
                    <button onclick="window.location.href='login.html'">Go to Login</button>
                </div>
            </div>
        </div>
    </div>

    <script src="verify.js"></script>
    <!-- WHATSAPP BUTTON -->
<a id="whatsappBtn"
  href="https://wa.me/256789817673?text=Hello%20Karibu%20Groceries!%20I%20would%20like%20to%20place%20an%20order."
  target="_blank"
  style="position: fixed; bottom: 90px; right: 30px; background: #25D366;
  color: white; width: 55px; height: 55px; border-radius: 50%;
  display: flex; justify-content: center; align-items: center;
  font-size: 28px; box-shadow: 0 4px 15px rgba(0,0,0,0.3);
  text-decoration: none; z-index: 999; transition: transform 0.3s;">
  <i class="fab fa-whatsapp"></i>
</a>

<script>
// WhatsApp button with basket items
document.addEventListener('DOMContentLoaded', function() {
  const btn = document.getElementById('whatsappBtn');
  if (!btn) return;
  
  const basket = JSON.parse(localStorage.getItem('karibu_basket')) || [];
  
  if (basket.length > 0) {
    const items = basket.map(item => 
      `• ${item.name} x${item.qty} = ${(item.price * item.qty).toLocaleString()} UGX`
    ).join('%0A');
    const total = basket.reduce((sum, item) => sum + item.price * item.qty, 0);
    const msg = `Hello Karibu Groceries!%0AI would like to order:%0A${items}%0A%0ATotal: ${total.toLocaleString()} UGX%0APlease confirm my order.`;
    btn.href = `https://wa.me/256789817673?text=${msg}`;
  }
  
  btn.addEventListener('mouseover', () => btn.style.transform = 'scale(1.1)');
  btn.addEventListener('mouseout', () => btn.style.transform = 'scale(1)');
});
</script> 
</body>

</html>
