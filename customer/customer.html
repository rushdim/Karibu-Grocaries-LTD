<div id="app" class="page">
    <h2 style="color: var(--blue);">Add New Customer</h2>

    <!-- Feedback Nachricht -->
    <div v-if="message" :style="{ color: messageColor, marginBottom: '15px', fontWeight: 'bold' }">
        {{ message }}
    </div>

    <div class="form-group">
        <label>Full Name</label>
        <input type="text" v-model="customer.name" placeholder="John Doe">
    </div>

    <div class="form-group">
        <label>Phone Number</label>
        <input type="tel" v-model="customer.phone" placeholder="0700000000">
    </div>

    <button @click="registerCustomer" class="btn" style="background: var(--blue);">
        Register Customer
    </button>
</div>
