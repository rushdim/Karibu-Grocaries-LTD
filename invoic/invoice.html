<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Invoice & Status Chart</title>
    <!-- Adding Vue.js and Chart.js via CDN -->
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="stylesheet" href="invoice.css">
    <style>
        .chart-container {
            width: 80%;
            margin: 20px auto;
        }

        .form-group {
            width: 100%;
            padding: 10px;
            margin-bottom: 20px;
        }
    </style>
</head>

<body>
    <div id="app" class="page">
        <h2 style="color: var(--purple);">Create Invoice</h2>

        <!-- Step 1: Status Selection -->
        <label>Update User Invoice Status:</label>
        <select v-model="currentStatus" @change="updateChart" class="form-group">
            <option value="Paid">Paid</option>
            <option value="Pending">Pending</option>
            <option value="Overdue">Overdue</option>
        </select>

        <!-- Step 2: The Bar Chart Canvas -->
        <div class="chart-container">
            <canvas id="userStatusChart"></canvas>
        </div>

        <div style="border: 1px dashed #ccc; padding: 20px; text-align: center;">
            <p>Invoice Preview for: {{ currentStatus }} Status</p>
        </div>

        <button class="btn" @click="exportToWord" style="background: var(--purple); margin-top: 10px;">
            Print Invoice (Open in Word)
        </button>

    </div>

    <script>
        const { createApp } = Vue;

        createApp({
            data() {
                return {
                    currentStatus: 'Paid',
                    chart: null,
                    // Sample data that could eventually come from your JSON folder [1]
                    userData: {
                        Paid: 15,
                        Pending: 8,
                        Overdue: 5
                    }
                }
            },
            mounted() {
                this.renderChart();
            },
            methods: {
                renderChart() {
                    const ctx = document.getElementById('userStatusChart').getContext('2d');
                    this.chart = new Chart(ctx, {
                        type: 'bar',
                        data: {
                            labels: ['Paid', 'Pending', 'Overdue'],
                            datasets: [{
                                label: 'Number of Invoices',
                                data: [this.userData.Paid, this.userData.Pending, this.userData.Overdue],
                                backgroundColor: ['#4CAF50', '#FFC107', '#F44336']
                            }]
                        },
                        options: {
                            responsive: true,
                            scales: { y: { beginAtZero: true } }
                        }
                    });
                },
                updateChart() {
                    // Logic to simulate data changing based on status
                    // In a real app, this would fetch from your backend folder [1]
                    this.userData[this.currentStatus] += 1;
                    this.chart.data.datasets.data = [
                        this.userData.Paid,
                        this.userData.Pending,
                        this.userData.Overdue
                    ];
                    this.chart.update();
                }
            }
        }).mount('#app');

        
    </script>
    <!-- WHATSAPP BUTTON -->
    <a id="whatsappBtn"
        href="https://wa.me/256789817673?text=Hello%20Karibu%20Groceries!%20I%20would%20like%20to%20place%20an%20order."
        target="_blank" style="position: fixed; bottom: 90px; right: 30px; background: #25D366;
      color: white; width: 55px; height: 55px; border-radius: 50%;
      display: flex; justify-content: center; align-items: center;
      font-size: 28px; box-shadow: 0 4px 15px rgba(0,0,0,0.3);
      text-decoration: none; z-index: 999; transition: transform 0.3s;">
        <i class="fab fa-whatsapp"></i>
    </a>
    
    <script>
        // WhatsApp button with basket items
        document.addEventListener('DOMContentLoaded', function () {
            const btn = document.getElementById('whatsappBtn');
            if (!btn) return;

            const basket = JSON.parse(localStorage.getItem('karibu_basket')) || [];

            if (basket.length > 0) {
                const items = basket.map(item =>
                    `• ${item.name} x${item.qty} = ${(item.price * item.qty).toLocaleString()} UGX`
                ).join('%0A');
                const total = basket.reduce((sum, item) => sum + item.price * item.qty, 0);
                const msg = `Hello Karibu Groceries!%0AI would like to order:%0A${items}%0A%0ATotal: ${total.toLocaleString()} UGX%0APlease confirm my order.`;
                btn.href = `https://wa.me/256789817673?text=${msg}`;
            }

            btn.addEventListener('mouseover', () => btn.style.transform = 'scale(1.1)');
            btn.addEventListener('mouseout', () => btn.style.transform = 'scale(1)');
        });
    </script>
</body>

</html>
