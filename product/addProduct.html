<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product</title>
    <link rel="stylesheet" href="product.css">
</head>

<body>

    <!-- Add Product (Orange) -->
    <div id="addProductPage" class="page">
        <h2 style="color: var(--orange);">Add New Product</h2>
        <div class="form-group">
            <label>Product Name</label>
            <input type="text" placeholder="e.g. Maize">
        </div>
        <div class="form-group">
            <label>Price</label>
            <input type="number" step="0.01">
        </div>
        <button class="btn" style="background: var(--orange);">Save Product</button>
    </div>
</body>

</html>
