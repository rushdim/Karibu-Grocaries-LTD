<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product</title>
    <link rel="stylesheet" href="product.css">
</head>

<body>





    <!-- Add Product (Orange) -->
    <div id="addProductPage" class="page">
        <h2 style="color: var(--orange);">Add New Product</h2>

        <!-- Status Message Container -->
        <div id="message" style="margin-bottom: 15px; font-weight: bold;"></div>

        <div class="form-group">
            <label>Product Name</label>
            <input type="text" id="productName" placeholder="e.g. Soyabeans">
        </div>
        <div class="form-group">
            <label>Price</label>
            <input type="number" id="productPrice" step="0.01">
        </div>
        <button id="saveBtn" class="btn" style="background: var(--orange);">Save Product</button>
    </div>
    <script src="addproduct.js" >

        

    </script>
    <script>
        async function loadProducts() {
                // You'll need a div with id="productGrid" in your home HTML
                const grid = document.getElementById('productGrid') || document.querySelector('.container');

                const response = await fetch('http://localhost:3000/api/products');
                const products = await response.json();

                const html = products.map(p => `
        <div class="product-card" style="border: 1px solid #ddd; padding: 15px; margin: 10px; border-radius: 8px;">
            <h4>${p.name}</h4>
            <p style="color: var(--orange); font-weight: bold;">Ksh ${p.price}</p>
            <button class="btn" style="background: orange; color: white; border: none; padding: 5px 10px;">Add to Basket</button>
        </div>
        `).join('');

                grid.innerHTML = `<div style="display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 20px;">${html}</div>`;
            }

            document.addEventListener('DOMContentLoaded', loadProducts);

    </script>

</body>

</html>
