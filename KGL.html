<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>KGL Admin Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body {
            background: #f4f7f6;
            display: flex;
            align-items: center;
            height: 100vh;
        }

        .login-card {
            width: 100%;
            max-width: 400px;
            padding: 2rem;
            border-radius: 15px;
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="card login-card mx-auto shadow">
            <div class="text-center mb-4">
                <i class="fas fa-seedling fa-3x text-success"></i>
                <h3 class="mt-2">Karibu Grocaries Admin Login</h3>
            </div>
            <form id="loginForm">
                <div class="mb-3">
                    <label class="form-label">Username</label>
                    <input type="text" id="adminUser" class="form-control" required>
                </div>
                <div class="mb-3">
                    <label class="form-label">Password</label>
                    <input type="password" class="form-control" required>
                </div>
                <button type="submit" class="btn btn-success w-100">Login</button>
            </form>
        </div>
    </div>
    <script>
        document.getElementById('loginForm').onsubmit = (e) => {
            e.preventDefault();
            // In a real KGL system, this would verify credentials against MongoDB [3]
            window.location.href = "Dashboard/dashboard.html";
        };
    </script>
</body>

</html>
