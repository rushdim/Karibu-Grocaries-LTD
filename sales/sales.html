<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Record Sale</title>
    <link rel="stylesheet" href="sales.css">
</head>

<body>
    <div class="container">
        <h1>Record Sale</h1>
        <form id="saleForm">
            <div class="form-group">
                <label for="buyerName">Buyer's Name</label>
                <input type="text" id="buyerName" name="buyerName">
            </div>
            <div class="form-group">
                <label for="amountPaid">Amount Paid (UgX)</label>
                <input type="number" id="amountPaid" name="amountPaid">
            </div>
            <div class="form-group checkbox-group">
                <input type="checkbox" id="creditSale" name="creditSale">
                <label for="creditSale">Is this a Credit Sale?</label>
            </div>
            <button type="submit" id="completeSale">Complete Sale</button>
        </form>
    </div>
    <script src="script.js"></script>
</body>

</html>
