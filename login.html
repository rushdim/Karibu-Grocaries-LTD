    <style>

        .login-card {
            width: 100%;

        }

        .toast-container {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 9999;
        }

        .custom-toast {
            min-width: 300px;
            padding: 15px 20px;
            margin-bottom: 10px;

            color: white;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);

            align-items: center;
            animation: slideIn 0.4s ease-out forwards;
        }

        .toast-success {
            background-color: #28a745;
        }

            background-color: #dc3545;
        }

        @keyframes slideIn {
            from {
                transform: translateX(100%);
                opacity: 0;
            }

            to {
                transform: translateX(0);
                opacity: 1;
            }
        }

        .fade-out {
            animation: fadeOut 0.5s ease-in forwards;
        }

        @keyframes fadeOut {
            to {
                opacity: 0;
                transform: translateX(20px);
            }
        }

    <!-- Toast Notifications -->
    <div id="toastContainer" class="toast-container"></div>

    <div class="container">
        <div class="card login-card mx-auto shadow border-0">
            <div class="text-center mb-4">
                <i class="fas fa-seedling fa-3x text-success"></i>
                <h3 class="mt-2 fw-bold">Karibu Groceries</h3>
                <p class="text-muted">Login to your portal</p>
            </div>

            <form id="loginForm">
                <div class="mb-3">
                    <label class="form-label">Email Address</label>
                    <div class="input-group">
                        <span class="input-group-text"><i class="fas fa-envelope"></i></span>

    <script src="login.js"></script>
    <!-- WHATSAPP BUTTON -->
    <a id="whatsappBtn"
        href="https://wa.me/256789817673?text=Hello%20Karibu%20Groceries!%20I%20would%20like%20to%20place%20an%20order."
        target="_blank" style="position: fixed; bottom: 90px; right: 30px; background: #25D366;
      color: white; width: 55px; height: 55px; border-radius: 50%;
      display: flex; justify-content: center; align-items: center;
      font-size: 28px; box-shadow: 0 4px 15px rgba(0,0,0,0.3);
      text-decoration: none; z-index: 999; transition: transform 0.3s;">
        <i class="fab fa-whatsapp"></i>
    </a>
    
    <script>
        // WhatsApp button with basket items
        document.addEventListener('DOMContentLoaded', function () {
            const btn = document.getElementById('whatsappBtn');
            if (!btn) return;

            const basket = JSON.parse(localStorage.getItem('karibu_basket')) || [];

            if (basket.length > 0) {
                const items = basket.map(item =>
                    `• ${item.name} x${item.qty} = ${(item.price * item.qty).toLocaleString()} UGX`
                ).join('%0A');
                const total = basket.reduce((sum, item) => sum + item.price * item.qty, 0);
                const msg = `Hello Karibu Groceries!%0AI would like to order:%0A${items}%0A%0ATotal: ${total.toLocaleString()} UGX%0APlease confirm my order.`;
                btn.href = `https://wa.me/256789817673?text=${msg}`;
            }

            btn.addEventListener('mouseover', () => btn.style.transform = 'scale(1.1)');
            btn.addEventListener('mouseout', () => btn.style.transform = 'scale(1)');
        });
    </script>
    <!-- CHATBOT -->
    <style>
        .chat-widget {
            position: fixed;
            bottom: 30px;
            left: 30px;
            z-index: 9999;
        }
    
        .chat-toggle {
            width: 55px;
            height: 55px;
            border-radius: 50%;
            background: linear-gradient(135deg, #1a6b3c, #2d9e5f);
            border: none;
            color: white;
            font-size: 24px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
            transition: transform 0.3s;
        }
    
        .chat-toggle:hover {
            transform: scale(1.1);
        }
    
        .chat-box {
            display: none;
            width: 320px;
            background: white;
            border-radius: 20px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.15);
            overflow: hidden;
            margin-bottom: 10px;
        }
    
        .chat-box.open {
            display: block;
            animation: slideUp 0.3s ease;
        }
    
        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
    
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
    
        .chat-header {
            background: linear-gradient(135deg, #1a6b3c, #2d9e5f);
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
    
        .chat-messages {
            height: 280px;
            overflow-y: auto;
            padding: 15px;
            background: #f9f9f9;
        }
    
        .msg {
            margin-bottom: 12px;
            display: flex;
        }
    
        .msg.bot {
            justify-content: flex-start;
        }
    
        .msg.user {
            justify-content: flex-end;
        }
    
        .msg-bubble {
            max-width: 80%;
            padding: 10px 14px;
            border-radius: 18px;
            font-size: 13px;
            line-height: 1.5;
        }
    
        .msg.bot .msg-bubble {
            background: white;
            color: #333;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
            border-bottom-left-radius: 4px;
        }
    
        .msg.user .msg-bubble {
            background: linear-gradient(135deg, #1a6b3c, #2d9e5f);
            color: white;
            border-bottom-right-radius: 4px;
        }
    
        .chat-suggestions {
            padding: 8px 15px;
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
            border-top: 1px solid #f0f0f0;
        }
    
        .suggestion-btn {
            background: #f0f9f4;
            border: 1px solid #1a6b3c;
            color: #1a6b3c;
            padding: 5px 10px;
            border-radius: 15px;
            font-size: 11px;
            cursor: pointer;
            white-space: nowrap;
        }
    
        .suggestion-btn:hover {
            background: #1a6b3c;
            color: white;
        }
    
        .chat-input-area {
            padding: 10px 15px;
            display: flex;
            gap: 8px;
            border-top: 1px solid #f0f0f0;
        }
    
        .chat-input {
            flex: 1;
            padding: 8px 12px;
            border: 1px solid #ddd;
            border-radius: 20px;
            outline: none;
            font-size: 13px;
        }
    
        .chat-send {
            background: #1a6b3c;
            color: white;
            border: none;
            width: 35px;
            height: 35px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 14px;
        }
    </style>
    
    <div class="chat-widget">
        <div class="chat-box" id="chatBox">
            <div class="chat-header">
                <div style="display: flex; align-items: center; gap: 10px;">
                    <div
                        style="width: 35px; height: 35px; background: white; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 20px;">
                        🤖</div>
                    <div>
                        <p style="color: white; margin: 0; font-weight: bold; font-size: 14px;">Karibu Assistant</p>
                        <p style="color: rgba(255,255,255,0.8); margin: 0; font-size: 11px;">🟢 Online</p>
                    </div>
                </div>
                <button onclick="toggleChat()"
                    style="background: none; border: none; color: white; font-size: 18px; cursor: pointer;">✕</button>
            </div>
    
            <div class="chat-messages" id="chatMessages"></div>
    
            <div class="chat-suggestions">
                <button class="suggestion-btn" onclick="quickReply('products')">🥦 Products</button>
                <button class="suggestion-btn" onclick="quickReply('prices')">💰 Prices</button>
                <button class="suggestion-btn" onclick="quickReply('order')">🛒 How to Order</button>
                <button class="suggestion-btn" onclick="quickReply('delivery')">🚚 Delivery</button>
                <button class="suggestion-btn" onclick="quickReply('contact')">📞 Contact</button>
            </div>
    
            <div class="chat-input-area">
                <input type="text" class="chat-input" id="chatInput" placeholder="Type a message..."
                    onkeypress="handleKey(event)">
                <button class="chat-send" onclick="sendMessage()">➤</button>
            </div>
        </div>
    
        <button class="chat-toggle" onclick="toggleChat()">💬</button>
    </div>
    
    <script>
        const botResponses = {
            hello: "Hello! Welcome to Karibu Groceries! 🛒 How can I help you today?",
            hi: "Hi there! 👋 Welcome to Karibu Groceries! What can I help you with?",
            products: "We sell fresh vegetables, fruits, and grains! 🥦🍌🌽\n\nIncluding: Beans, Maize, Tomatoes, Onions, Bananas, Passion Fruits and more!\n\n<a href='/all Products/product.html' style='color:#1a6b3c;'>View all products →</a>",
            prices: "Our prices are very affordable! 💰\n\n• Beans: 4,000 UGX\n• Maize: 8,500 UGX\n• Tomato: 1,200 UGX\n• Onion: 3,000 UGX\n• Banana: 2,000 UGX\n• Cabbage: 1,000 UGX\n\n<a href='/all Products/product.html' style='color:#1a6b3c;'>See all prices →</a>",
            order: "Ordering is easy! 🛒\n\n1. Browse products\n2. Click 'Add to Basket'\n3. Go to Basket\n4. Fill your details\n5. Confirm your order!\n\nOr order via WhatsApp: <a href='https://wa.me/256789817673' style='color:#1a6b3c;'>+256 789 817 673</a>",
            delivery: "We deliver in Kampala! 🚚\n\n✅ Free delivery on all orders\n✅ Same day delivery available\n⏰ Mon-Sat: 8am - 8pm\n\nDelivery areas: Kampala and surrounding areas",
            contact: "You can reach us! 📞\n\n📱 WhatsApp: +256 789 817 673\n📧 Email: karibugroceries@gmail.com\n📍 Location: Kampala, Uganda\n⏰ Mon-Sat: 8am - 8pm",
            payment: "We accept multiple payment methods! 💳\n\n✅ Cash on Delivery\n✅ MTN Mobile Money\n✅ Airtel Money",
            hours: "We are open Monday to Saturday, 8am to 8pm! ⏰",
            basket: "To add items to your basket, click the '🛒 Add to Basket' button on any product. You can view your basket at any time!",
            help: "I can help you with:\n\n🥦 Products & Prices\n🛒 How to Order\n🚚 Delivery Info\n💳 Payment Methods\n📞 Contact Us\n\nJust ask me anything!",
            thanks: "You're welcome! 😊 Happy shopping at Karibu Groceries! 🛒",
            bye: "Goodbye! 👋 Thank you for visiting Karibu Groceries! Come back soon! 🛒",
        };

        function getResponse(input) {
            const msg = input.toLowerCase().trim();
            if (msg.includes('hello') || msg.includes('hey')) return botResponses.hello;
            if (msg.includes('hi')) return botResponses.hi;
            if (msg.includes('product') || msg.includes('sell') || msg.includes('have')) return botResponses.products;
            if (msg.includes('price') || msg.includes('cost') || msg.includes('how much') || msg.includes('ugx')) return botResponses.prices;
            if (msg.includes('order') || msg.includes('buy') || msg.includes('purchase')) return botResponses.order;
            if (msg.includes('deliver') || msg.includes('shipping') || msg.includes('bring')) return botResponses.delivery;
            if (msg.includes('contact') || msg.includes('phone') || msg.includes('call') || msg.includes('whatsapp')) return botResponses.contact;
            if (msg.includes('pay') || msg.includes('payment') || msg.includes('money') || msg.includes('momo')) return botResponses.payment;
            if (msg.includes('hour') || msg.includes('open') || msg.includes('time') || msg.includes('when')) return botResponses.hours;
            if (msg.includes('basket') || msg.includes('cart') || msg.includes('add')) return botResponses.basket;
            if (msg.includes('help') || msg.includes('what can')) return botResponses.help;
            if (msg.includes('thank')) return botResponses.thanks;
            if (msg.includes('bye') || msg.includes('goodbye')) return botResponses.bye;
            return "I'm not sure about that 🤔 But I can help you with:\n\n• Products & Prices\n• How to Order\n• Delivery Info\n• Payment Methods\n• Contact Us\n\nWhat would you like to know?";
        }

        function addMessage(text, sender) {
            const messages = document.getElementById('chatMessages');
            const msg = document.createElement('div');
            msg.className = `msg ${sender}`;
            msg.innerHTML = `<div class="msg-bubble">${text.replace(/\n/g, '<br>')}</div>`;
            messages.appendChild(msg);
            messages.scrollTop = messages.scrollHeight;
        }

        function sendMessage() {
            const input = document.getElementById('chatInput');
            const text = input.value.trim();
            if (!text) return;
            addMessage(text, 'user');
            input.value = '';
            setTimeout(() => {
                addMessage(getResponse(text), 'bot');
            }, 600);
        }

        function quickReply(topic) {
            const questions = {
                products: 'What products do you sell?',
                prices: 'What are your prices?',
                order: 'How do I place an order?',
                delivery: 'Do you deliver?',
                contact: 'How can I contact you?'
            };
            addMessage(questions[topic], 'user');
            setTimeout(() => addMessage(botResponses[topic], 'bot'), 600);
        }

        function handleKey(e) {
            if (e.key === 'Enter') sendMessage();
        }

        let chatOpen = false;
        function toggleChat() {
            chatOpen = !chatOpen;
            const box = document.getElementById('chatBox');
            box.classList.toggle('open', chatOpen);
            if (chatOpen && document.getElementById('chatMessages').children.length === 0) {
                setTimeout(() => {
                    addMessage("Hello! 👋 Welcome to <strong>Karibu Groceries</strong>! 🛒<br><br>I'm your shopping assistant. How can I help you today?", 'bot');
                }, 300);
            }
        }
    </script>
    <script>
        const menuToggle = document.getElementById('menuToggle');
        const navLinks = document.getElementById('navLinks');

        menuToggle.addEventListener('click', () => {
            navLinks.classList.toggle('active');
        });
    </script>
    <script src="/js/translations.js"></script>
