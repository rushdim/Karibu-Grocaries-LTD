

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>KGL Admin Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body {
            background: #f4f7f6;
            display: flex;
            align-items: center;
            height: 100vh;
        }

        .login-card {
            width: 100%;
            max-width: 400px;
            padding: 2rem;
            border-radius: 15px;
        }

        /* --- CUSTOM TOAST CSS --- */
        .toast-container {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 9999;
        }

        .custom-toast {
            min-width: 300px;
            padding: 15px 20px;
            margin-bottom: 10px;
            border-radius: 8px;
            color: white;
            font-weight: 500;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
            display: flex;
            align-items: center;
            justify-content: space-between;
            animation: slideIn 0.4s ease-out forwards;
        }

        .toast-success {
            background-color: #28a745;
        }

        .toast-error {
            background-color: #dc3545;
        }

        @keyframes slideIn {
            from {
                transform: translateX(100%);
                opacity: 0;
            }

            to {
                transform: translateX(0);
                opacity: 1;
            }
        }

        .fade-out {
            animation: fadeOut 0.5s ease-in forwards;
        }

        @keyframes fadeOut {
            to {
                opacity: 0;
                transform: translateX(20px);
            }
        }
    </style>
</head>

<body>
    <!-- Toast Container for Notifications -->
    <div id="toastContainer" class="toast-container"></div>

    <div class="container">
        <div class="card login-card mx-auto shadow">
            <div class="text-center mb-4">
                <i class="fas fa-seedling fa-3x text-success"></i>
                <h3 class="mt-2">Karibu Groceries Admin Login</h3>
            </div>
            <form id="loginForm">
                <div class="mb-3">
                    <label class="form-label">Username</label>
                    <input type="text" id="adminUser" class="form-control">
                </div>
                <div class="mb-3">
                    <label class="form-label">Password</label>
                    <input type="password" id="adminPass" class="form-control">
                </div>
                <button type="submit" class="btn btn-success w-100">Login</button>
            </form>
        </div>
    </div>

    <script>
       

        // CUSTOM TOAST FUNCTION
        function showToast(message, type) {
            const container = document.getElementById('toastContainer');
            const toast = document.createElement('div');
            toast.className = `custom-toast ${type === 'success' ? 'toast-success' : 'toast-error'}`;
            toast.innerHTML = `<span>${message}</span>`;
            container.appendChild(toast);

            setTimeout(() => {
                toast.classList.add('fade-out');
                setTimeout(() => toast.remove(), 500);
            }, 3000);
        }

        // LOGIN BYPASS: Accepts any input
        document.getElementById('loginForm').onsubmit = (e) => {
            e.preventDefault();

            const userVal = document.getElementById('adminUser').value.trim();
            const passVal = document.getElementById('adminPass').value.trim();

            // Just ensure they aren't completely empty for basic UX
            if (!userVal || !passVal) {
                showToast("Please enter something to continue.", "error");
                return;
            }

            // SUCCESS: No database check. We just create a session for whoever logged in.
            showToast(`Welcome, ${userVal}! Redirecting...`, "success");

            localStorage.setItem('currentSession', JSON.stringify({
                name: userVal,
                role: "Guest/Admin", // Assigned role
                timestamp: new Date().toISOString().split('T')[0]
            }));

            // Redirect
            setTimeout(() => {
                window.location.href = "Dashboard/dashboard.html";
            }, 1200);
        };
    </script>
</body>

</html>
