

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>KGL Admin Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body {
            background: #f4f7f6;
            display: flex;
            align-items: center;
            height: 100vh;
        }

        .login-card {
            width: 100%;
            max-width: 400px;
            padding: 2rem;
            border-radius: 15px;
        }

        /* --- CUSTOM TOAST CSS --- */
        .toast-container {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 9999;
        }

        .custom-toast {
            min-width: 300px;
            padding: 15px 20px;
            margin-bottom: 10px;
            border-radius: 8px;
            color: white;
            font-weight: 500;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
            display: flex;
            align-items: center;
            justify-content: space-between;
            animation: slideIn 0.4s ease-out forwards;
        }

        .toast-success {
            background-color: #28a745;
        }

        .toast-error {
            background-color: #dc3545;
        }

        @keyframes slideIn {
            from {
                transform: translateX(100%);
                opacity: 0;
            }

            to {
                transform: translateX(0);
                opacity: 1;
            }
        }

        .fade-out {
            animation: fadeOut 0.5s ease-in forwards;
        }

        @keyframes fadeOut {
            to {
                opacity: 0;
                transform: translateX(20px);
            }
        }
    </style>
</head>

<body>
    <!-- Toast Container for Notifications -->
    <div id="toastContainer" class="toast-container"></div>

    <div class="container">
        <div class="card login-card mx-auto shadow">
            <div class="text-center mb-4">
                <i class="fas fa-seedling fa-3x text-success"></i>
                <h3 class="mt-2">Karibu Groceries Admin Login</h3>
            </div>
            <form id="loginForm">
                <div class="mb-3">
                    <label class="form-label">Username</label>
                    <input type="text" id="adminUser" class="form-control">
                </div>
                <div class="mb-3">
                    <label class="form-label">Password</label>
                    <input type="password" id="adminPass" class="form-control">
                </div>
                <button type="submit" class="btn btn-success w-100">Login</button>
            </form>
        </div>
    </div>

    <script>
        // 1. DATA PERSISTENCE: Initial Setup for 2026
        document.addEventListener('DOMContentLoaded', () => {
            const users = JSON.parse(localStorage.getItem('registeredUsers')) || [];
            const adminExists = users.find(u => u.username === 'kgl_admin');

            if (!adminExists) {
                const defaultUser = {
                    username: "kgl_admin",
                    password: "groceries2026",
                    role: "Manager"
                };
                users.push(defaultUser);
                localStorage.setItem('registeredUsers', JSON.stringify(users));
                console.log("2026 Default User Created.");
            }
        });

        // 2. CUSTOM TOAST FUNCTION
        function showToast(message, type) {
            const container = document.getElementById('toastContainer');
            const toast = document.createElement('div');
            toast.className = `custom-toast ${type === 'success' ? 'toast-success' : 'toast-error'}`;
            toast.innerHTML = `<span>${message}</span>`;

            container.appendChild(toast);

            // Remove after 3 seconds
            setTimeout(() => {
                toast.classList.add('fade-out');
                setTimeout(() => toast.remove(), 500);
            }, 3000);
        }

        // 3. LOGIN VALIDATION & ERROR HANDLING
        document.getElementById('loginForm').onsubmit = (e) => {
            e.preventDefault();

            const userVal = document.getElementById('adminUser').value.trim();
            const passVal = document.getElementById('adminPass').value.trim();

            // Validation: Empty Fields
            if (!userVal || !passVal) {
                showToast("Please enter both username and password.", "error");
                return;
    
            }
     

            const users = JSON.parse(localStorage.getItem('registeredUsers')) || [];
            const user = users.find(u => u.username === userVal);

            // Validation: User Not Found
            if (!user) {
                showToast("Username does not exist.", "error");
                return;
            }

            // Validation: Wrong Password
            if (user.password !== passVal) {
                showToast("Incorrect password. Please try again.", "error");
                return;
            }

            // 4. INTEGRATION & ROUTING
            showToast("Login Successful! Redirecting...", "success");

            // Store Current Session
            localStorage.setItem('currentSession', JSON.stringify({
                name: user.username,
                role: user.role,
                timestamp: "2026-01-24"
            }));

            // Redirect after toast is visible
            setTimeout(() => {
                window.location.href = "Dashboard/dashboard.html";
            }, 1200);
        };
    </script>
</body>

</html>
