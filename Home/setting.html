<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard</title>
    <!-- Font Awesome for Icons -->
    <link rel="stylesheet" href="cdnjs.cloudflare.com">
    <link rel="stylesheet" href="/settings/style.css">
</head>
<body>

    <!-- DASHBOARD PAGE -->
    <div id="dashboard-page" class="page-container">
        <header>
            <h1>Dashboard</h1>
            <i class="fa-solid fa-gear settings-icon" onclick="showPage('settings-page')"></i>
        </header>
        <main>
            <div class="card-grid">
                <div class="card">
                    <h3>Total Sales</h3>
                    <p>UgX 4,500,000</p>
                </div>
                <div class="card">
                    <h3>Customers</h3>
                    <p>124 Active</p>
                </div>
            </div>
        </main>
    </div>

    <!-- SETTINGS PAGE -->
    <div id="settings-page" class="page-container hidden">
        <header>
            <i class="fa-solid fa-arrow-left back-btn" onclick="showPage('dashboard-page')"></i>
            <h1>Settings</h1>
        </header>
        <main>
            <div id="settings-feedback" class="feedback-msg"></div>

            <div class="settings-item">
                <h3>Admin Profile</h3>
                <label>Update Name:</label>
                <input type="text" id="admin-username" placeholder="Admin Name">
            </div>

            <div class="settings-item">
                <label>Theme:</label>
                <button id="theme-toggle" class="btn-toggle" onclick="toggleDarkMode()">
                    <i class="fa-solid fa-moon"></i> Switch Mode
                </button>
            </div>

            <div class="settings-item">
                <label>Language:</label>
                <select id="language-select">
                    <option value="en">English</option>
                    <option value="ar">Arabic</option>
                    <option value="es">Spanish</option>
                </select>
            </div>

            <button class="save-btn" onclick="saveSettings()">Save All Changes</button>
            <hr>
            <button class="logout-btn" onclick="handleLogout()">Logout</button>
        </main>
    </div>

    <script>
        // Switch Pages
            function showPage(pageId) {
                document.querySelectorAll('.page-container').forEach(p => p.classList.add('hidden'));
                document.getElementById(pageId).classList.remove('hidden');
            }

            // Logout & Redirect
            function handleLogout() {
                if (confirm("Are you sure you want to logout?")) {
                    // Clear local session data if needed
                    localStorage.removeItem('userLoggedIn');
                    // Redirect to login page (ensure this file exists)
                    window.location.href = "admin_login.html";
                }
            }

            // Dark Mode Toggle
            function toggleDarkMode() {
                const body = document.body;
                body.classList.toggle('dark-mode');

                // Save preference for 2026 sessions
                const isDark = body.classList.contains('dark-mode');
                localStorage.setItem('theme', isDark ? 'dark' : 'light');
            }

            // Save Settings with Validation
            function saveSettings() {
                const name = document.getElementById('admin-username').value.trim();
                const feedback = document.getElementById('settings-feedback');

                feedback.style.display = "block";

                if (name === "") {
                    feedback.style.backgroundColor = "#ffdddd";
                    feedback.style.color = "red";
                    feedback.innerText = "Error: Please enter a name.";
                } else {
                    feedback.style.backgroundColor = "#ddffdd";
                    feedback.style.color = "green";
                    feedback.innerText = "Success: Settings updated for 2026!";
                    // Reset name input if desired
                    console.log("Saving user:", name);
                }
            }

            // Check saved theme on load
            window.onload = () => {
                if (localStorage.getItem('theme') === 'dark') {
                    document.body.classList.add('dark-mode');
                }
            };

    </script>
    <!-- WHATSAPP BUTTON -->
    <a id="whatsappBtn"
        href="https://wa.me/256789817673?text=Hello%20Karibu%20Groceries!%20I%20would%20like%20to%20place%20an%20order."
        target="_blank" style="position: fixed; bottom: 90px; right: 30px; background: #25D366;
      color: white; width: 55px; height: 55px; border-radius: 50%;
      display: flex; justify-content: center; align-items: center;
      font-size: 28px; box-shadow: 0 4px 15px rgba(0,0,0,0.3);
      text-decoration: none; z-index: 999; transition: transform 0.3s;">
        <i class="fab fa-whatsapp"></i>
    </a>
    
    <script>
        // WhatsApp button with basket items
        document.addEventListener('DOMContentLoaded', function () {
            const btn = document.getElementById('whatsappBtn');
            if (!btn) return;

            const basket = JSON.parse(localStorage.getItem('karibu_basket')) || [];

            if (basket.length > 0) {
                const items = basket.map(item =>
                    `• ${item.name} x${item.qty} = ${(item.price * item.qty).toLocaleString()} UGX`
                ).join('%0A');
                const total = basket.reduce((sum, item) => sum + item.price * item.qty, 0);
                const msg = `Hello Karibu Groceries!%0AI would like to order:%0A${items}%0A%0ATotal: ${total.toLocaleString()} UGX%0APlease confirm my order.`;
                btn.href = `https://wa.me/256789817673?text=${msg}`;
            }

            btn.addEventListener('mouseover', () => btn.style.transform = 'scale(1.1)');
            btn.addEventListener('mouseout', () => btn.style.transform = 'scale(1)');
        });
    </script>
</body>

</html>
