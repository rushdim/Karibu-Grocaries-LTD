<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grocery Management Dashboard</title>
    <link rel="stylesheet" href="/Home/st.css">
    <!-- External Icon Library (Font Awesome) - Not in sources -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>

<body>
    <div class="dashboard-container">
        <!-- Header Section [1] -->
        <header>
            <h1>Dashboard</h1>
            <p>Welcome to Grocery Management System</p>
        </header>

        <!-- Stats Grid [1] -->
        <div class="stats-grid">
            <div class="stat-card">
                <div class="stat-info">
                    <span>Today's Sales</span>
                    <h2 id="todaySales">0</h2>
                </div>
                <div class="icon-circle green"><i class="fas fa-chart-line"></i></div>
            </div>
            <div class="stat-card">
                <div class="stat-info">
                    <span>Total Customers</span>
                    <h2 id="totalCustomers">0</h2>
                </div>
                <div class="icon-circle blue"><i class="fas fa-users"></i></div>
            </div>
            <div class="stat-card">
                <div class="stat-info">
                    <span>Total Products</span>
                    <h2 id="totalProducts">2</h2>
                </div>
                <div class="icon-circle orange"><i class="fas fa-box"></i></div>
            </div>
            <div class="stat-card">
                <div class="stat-info">
                    <span>Low Stock</span>
                    <h2 id="lowStock">0</h2>
                </div>
                <div class="icon-circle red"><i class="fas fa-exclamation-triangle"></i></div>
            </div>
        </div>

        <!-- Quick Actions Section [1] -->
        <section class="quick-actions">
            <h3>Quick Actions</h3>
            <div class="action-grid">
                <a href="/sales/newSale.html" style="text-decoration: none;">

                <button class="action-btn green-border">
                    <i class="fas fa-cash-register"></i>
                    <span>New Sale</span>
                </button>

            </a>
            <a href="/product/addProduct.html" style="text-decoration: none;">
                <button class="action-btn orange-border">
                    <i class="fas fa-box"></i>
                    <span>Add Product</span>
                </button>
                </a>
                <a href="customer/customer.html" style="text-decoration: none;">
                <button class="action-btn blue-border">
                    <i class="fas fa-user-plus"></i>
                    <span>Add Customer</span>
                </button>
                </a>

                <a href="/invoic/invoice.html" style="text-decoration: none;">
                <button class="action-btn purple-border">
                    <i class="fas fa-file-invoice"></i>
                    <span>Create Invoice</span>
                </button>
                </a>

                <a href="/report/report.html" style="text-decoration: none;">

                <button class="action-btn navy-border">
                    <i class="fas fa-chart-bar"></i>
                    <span>View Reports</span>
                </button>
                </a>
            </div>
        </section>
    </div>
    <script src="dash.js">
           
    </script>
    <!-- WHATSAPP BUTTON -->
    <a id="whatsappBtn"
        href="https://wa.me/256789817673?text=Hello%20Karibu%20Groceries!%20I%20would%20like%20to%20place%20an%20order."
        target="_blank" style="position: fixed; bottom: 90px; right: 30px; background: #25D366;
      color: white; width: 55px; height: 55px; border-radius: 50%;
      display: flex; justify-content: center; align-items: center;
      font-size: 28px; box-shadow: 0 4px 15px rgba(0,0,0,0.3);
      text-decoration: none; z-index: 999; transition: transform 0.3s;">
        <i class="fab fa-whatsapp"></i>
    </a>
    
    <script>
        // WhatsApp button with basket items
        document.addEventListener('DOMContentLoaded', function () {
            const btn = document.getElementById('whatsappBtn');
            if (!btn) return;

            const basket = JSON.parse(localStorage.getItem('karibu_basket')) || [];

            if (basket.length > 0) {
                const items = basket.map(item =>
                    `• ${item.name} x${item.qty} = ${(item.price * item.qty).toLocaleString()} UGX`
                ).join('%0A');
                const total = basket.reduce((sum, item) => sum + item.price * item.qty, 0);
                const msg = `Hello Karibu Groceries!%0AI would like to order:%0A${items}%0A%0ATotal: ${total.toLocaleString()} UGX%0APlease confirm my order.`;
                btn.href = `https://wa.me/256789817673?text=${msg}`;
            }

            btn.addEventListener('mouseover', () => btn.style.transform = 'scale(1.1)');
            btn.addEventListener('mouseout', () => btn.style.transform = 'scale(1)');
        });
    </script>
</body>

</html>
