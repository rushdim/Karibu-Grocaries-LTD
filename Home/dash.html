<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grocery Management Dashboard</title>
    <link rel="stylesheet" href="/Home/st.css">
    <!-- External Icon Library (Font Awesome) - Not in sources -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>

<body>
    <div class="dashboard-container">
        <!-- Header Section [1] -->
        <header>
            <h1>Dashboard</h1>
            <p>Welcome to Grocery Management System</p>
        </header>

        <!-- Stats Grid [1] -->
        <div class="stats-grid">
            <div class="stat-card">
                <div class="stat-info">
                    <span>Today's Sales</span>
                    <h2 id="todaySales">0</h2>
                </div>
                <div class="icon-circle green"><i class="fas fa-chart-line"></i></div>
            </div>
            <div class="stat-card">
                <div class="stat-info">
                    <span>Total Customers</span>
                    <h2 id="totalCustomers">0</h2>
                </div>
                <div class="icon-circle blue"><i class="fas fa-users"></i></div>
            </div>
            <div class="stat-card">
                <div class="stat-info">
                    <span>Total Products</span>
                    <h2 id="totalProducts">2</h2>
                </div>
                <div class="icon-circle orange"><i class="fas fa-box"></i></div>
            </div>
            <div class="stat-card">
                <div class="stat-info">
                    <span>Low Stock</span>
                    <h2 id="lowStock">0</h2>
                </div>
                <div class="icon-circle red"><i class="fas fa-exclamation-triangle"></i></div>
            </div>
        </div>

        <!-- Quick Actions Section [1] -->
        <section class="quick-actions">
            <h3>Quick Actions</h3>
            <div class="action-grid">
                <a href="/sales/newSale.html" style="text-decoration: none;">

                <button class="action-btn green-border">
                    <i class="fas fa-cash-register"></i>
                    <span>New Sale</span>
                </button>

            </a>
            <a href="/product/addProduct.html" style="text-decoration: none;">
                <button class="action-btn orange-border">
                    <i class="fas fa-box"></i>
                    <span>Add Product</span>
                </button>
                </a>
                <a href="customer/customer.html" style="text-decoration: none;">
                <button class="action-btn blue-border">
                    <i class="fas fa-user-plus"></i>
                    <span>Add Customer</span>
                </button>
                </a>

                <a href="/invoic/invoice.html" style="text-decoration: none;">
                <button class="action-btn purple-border">
                    <i class="fas fa-file-invoice"></i>
                    <span>Create Invoice</span>
                </button>
                </a>

                <a href="/report/report.html" style="text-decoration: none;">

                <button class="action-btn navy-border">
                    <i class="fas fa-chart-bar"></i>
                    <span>View Reports</span>
                </button>
                </a>
            </div>
        </section>
    </div>
    <script src="dash.js">
           
    </script>
</body>

</html>
