<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Karibu Groceries | Admin & Shop</title>
    <link rel="stylesheet" href="/settings/style.css">
    <script src="https://kit.fontawesome.com" crossorigin="anonymous"></script>
</head>

<body>

    <nav class="navbar">
        <div class="logo">Karibu <span>Groceries</span></div>
        <div class="user-info">Founder: Rushdi Mustafa</div>
        <div class="cart-icon" onclick="toggleCart()">
            🛒 <span id="cart-count">0</span>
        </div>
    </nav>

    <main class="dashboard">
        <!-- Sidebar Navigation -->
        <aside class="sidebar">
            <h3>Categories</h3>
            <ul>
                <li class="active" onclick="filterShop('all')">All Products</li>
                <li onclick="filterShop('fresh')">Fresh Produce</li>
                <li onclick="filterShop('pantry')">Pantry</li>
                <li onclick="filterShop('dairy')">Dairy</li>
            </ul>
        </aside>

        <!-- Product Display Area -->
        <section class="content">
            <div class="header-flex">
                <h1>Marketplace</h1>
                <p id="date-display"></p>
            </div>

            <div class="product-grid" id="product-list">
                <!-- Products will be injected by JavaScript -->
            </div>
        </section>
    </main>

    <!-- Floating Cart UI -->
    <div id="cart-sidebar" class="cart-hidden">
        <h3>Your Basket</h3>
        <div id="cart-items"></div>
        <hr>
        <button class="checkout-btn">Checkout via WhatsApp</button>
    </div>

    <script src="/settings/script.js"></script>
</body>

</html>
